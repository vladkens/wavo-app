name: main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # ALSA for cpal; fonts and text libraries for the HUD's tests in nimbo's harness.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libfontconfig1 libfreetype6 libharfbuzz0b fonts-dejavu-core
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: rustup target add aarch64-apple-darwin x86_64-pc-windows-gnu
      - run: python3 -m venv ~/zig && ~/zig/bin/pip install -q cargo-zigbuild==0.23.4 ziglang==0.16.0 && echo ~/zig/bin >> "$GITHUB_PATH"
      - run: make check CROSS="aarch64-apple-darwin x86_64-pc-windows-gnu"
      - run: make test

  # A job per OS; aarch64 cross-compiled.
  build:
    name: build ${{ matrix.os }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS
            runner: macos-latest
            dist: make dist
          - os: Windows
            runner: windows-latest
            dist: make dist T=x86_64-pc-windows-msvc && make dist T=aarch64-pc-windows-msvc
          - os: Linux
            runner: ubuntu-latest
            dist: make dist T=x86_64-unknown-linux-gnu && make dist T=aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      # Linux aarch64 cross-build.
      PKG_CONFIG_ALLOW_CROSS: 1
      PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
    steps:
      - uses: actions/checkout@v7
      # arm64 ALSA from Ubuntu's ports mirror.
      - if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          . /etc/os-release
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: %s %s-updates\nComponents: main universe\nArchitectures: arm64\n' "$VERSION_CODENAME" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/arm64.sources
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libasound2-dev:arm64
          rustup target add aarch64-unknown-linux-gnu
          python3 -m venv ~/zig && ~/zig/bin/pip install -q cargo-zigbuild==0.23.4 ziglang==0.16.0 && echo ~/zig/bin >> "$GITHUB_PATH"
      # The runner image has no make.
      - if: runner.os == 'Windows'
        run: |
          rustup target add aarch64-pc-windows-msvc
          choco install make --no-progress -y
      - uses: vladkens/actions/rust-build@v1
        with:
          name: Wavo
          dist: ${{ matrix.dist }}
          dev: true
          crates: false
          artifact: release-${{ matrix.os }}

  # tmp, proof only: pack run directly, the files uploaded, nothing published.
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, build]
    runs-on: ubuntu-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      UPDATE_KEY: ${{ secrets.UPDATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: target/distrib
      - run: sudo apt-get update && sudo apt-get install -y nsis hfsprogs
      - run: make pack
      - uses: actions/upload-artifact@v7
        with:
          name: packed-dev
          path: target/distrib/Wavo-*
      - run: rm -f target/distrib/Wavo-* && make pack TAG=v0.1.0
      - uses: actions/upload-artifact@v7
        with:
          name: packed-release
          path: |
            target/distrib/Wavo-*
            target/distrib/update.txt

  # tmp, proof only: what the files hold, in a job without secrets.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packed-dev
          path: packed
      - run: sudo apt-get update -q && sudo apt-get install -yq 7zip python3-pefile
      - run: ls -l packed
      - name: The setups' files
        run: for s in packed/*-setup.exe; do 7z x -y -o"x/$(basename "$s")" "$s" > /dev/null; done; find x -type f
      - name: The exes' resources
        shell: python3 {0}
        run: |
          import glob, pefile
          names = {3: "ICON", 14: "GROUP_ICON", 16: "VERSION", 24: "MANIFEST"}
          for path in sorted(glob.glob("x/*/*.exe")):
              pe = pefile.PE(path)
              print("==", path, pe.FILE_HEADER.NumberOfSections, [s.Name.rstrip(b"\0") for s in pe.sections])
              res = pe.DIRECTORY_ENTRY_RESOURCE.entries if hasattr(pe, "DIRECTORY_ENTRY_RESOURCE") else []
              for t in res:
                  print(" ", names.get(t.id, t.id), [e.id for e in t.directory.entries])
              for fi in getattr(pe, "FileInfo", []):
                  for f in fi:
                      for st in getattr(f, "StringTable", []):
                          print(" ", {k.decode(): v.decode() for k, v in st.entries.items()})
              print("  warnings:", pe.get_warnings()[:5])
      - name: The newest glibc the Linux binaries need
        run: |
          for d in packed/*.deb; do dpkg-deb -x "$d" "deb-$(basename "$d")"; done
          for b in deb-*/usr/bin/*; do echo "$b: $(readelf -V -W "$b" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)"; done
      - name: The AppImage and the .deb
        run: |
          a=$(ls packed/*x86_64.AppImage) && chmod +x "$a" && (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$a" --appimage-extract > /dev/null && ls squashfs-root && cat squashfs-root/*.desktop)
          for d in packed/*.deb; do echo "== $d"; dpkg-deb -I "$d"; dpkg-deb -c "$d"; done
