name: main

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: a PR renamed to `release: v…`
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # ALSA for cpal; fonts and text libraries for the HUD's tests in nimbo's harness.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libfontconfig1 libfreetype6 libharfbuzz0b fonts-dejavu-core
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: rustup target add aarch64-apple-darwin x86_64-pc-windows-gnu
      - run: python3 -m venv ~/zig && ~/zig/bin/pip install -q cargo-zigbuild==0.23.4 ziglang==0.16.0 && echo ~/zig/bin >> "$GITHUB_PATH"
      - run: make check CROSS="aarch64-apple-darwin x86_64-pc-windows-gnu"
      - run: make test

  # A job per OS; aarch64 cross-compiled. Linux on the oldest LTS for its glibc. Also on release PRs,
  # which rust-build checks.
  build:
    name: build ${{ matrix.os }}
    if: "github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'release: v')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS
            runner: macos-latest
            dist: make dist
          - os: Windows
            runner: windows-latest
            dist: make dist T=x86_64-pc-windows-msvc && make dist T=aarch64-pc-windows-msvc
          - os: Linux
            runner: ubuntu-22.04
            dist: make dist T=x86_64-unknown-linux-gnu && make dist T=aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      # Linux aarch64 cross-build.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      PKG_CONFIG_ALLOW_CROSS: 1
      PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
    steps:
      - uses: actions/checkout@v7
      # arm64 ALSA from Ubuntu's ports mirror.
      - if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture arm64
          sudo rm -f /etc/apt/sources.list.d/*
          sudo sed -i -E 's/^deb ([^[])/deb [arch=amd64] \1/' /etc/apt/sources.list
          for suite in jammy jammy-updates; do
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $suite main universe"
          done | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libasound2-dev:arm64 gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      # The runner image has no make.
      - if: runner.os == 'Windows'
        run: |
          rustup target add aarch64-pc-windows-msvc
          choco install make --no-progress -y
      - uses: vladkens/actions/rust-build@v1
        with:
          name: Wavo
          dist: ${{ matrix.dist }}
          dev: true
          crates: false
          artifact: release-${{ matrix.os }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # One artifact for rust-publish, from the build jobs' own.
      - uses: actions/upload-artifact/merge@v7
        with:
          name: release
          pattern: release-*
      - run: sudo apt-get update && sudo apt-get install -y nsis && cargo install --locked shipo
      - uses: vladkens/actions/rust-publish@v1
        with:
          name: Wavo
          crates: false
          pack: make pack
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SHIPO_UPDATE_KEY: ${{ secrets.SHIPO_UPDATE_KEY }}
