name: main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release:') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # ALSA for cpal; fonts and text libraries for the HUD's tests in nimbo's harness.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libfontconfig1 libfreetype6 libharfbuzz0b fonts-dejavu-core
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: rustup target add aarch64-apple-darwin x86_64-pc-windows-gnu
      - run: python3 -m venv ~/zig && ~/zig/bin/pip install -q cargo-zigbuild==0.23.4 ziglang==0.16.0 && echo ~/zig/bin >> "$GITHUB_PATH"
      - run: make check CROSS="aarch64-apple-darwin x86_64-pc-windows-gnu"
      - run: make test

  # A job per target, each on its runner's own OS and CPU (arm64 on GitHub's ARM runners): none
  # cross-compiles, and each keeps its own cache. Linux on the oldest LTS for its glibc. Also on
  # release PRs, which rust-build checks.
  build:
    name: build ${{ matrix.target }}
    if: "github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'release: v')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # ALSA for cpal.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - uses: vladkens/actions/rust-build@v1
        with:
          name: Wavo
          dist: make dist T=${{ matrix.target }}
          dev: true
          crates: false
          artifact: release-${{ matrix.target }}

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # One artifact for rust-publish, from the build jobs' own.
      - uses: actions/upload-artifact/merge@v7
        with:
          name: release
          pattern: release-*
      # shipo, the packer: its latest release's prebuilt binary.
      - run: |
          mkdir -p "$RUNNER_TEMP/shipo"
          gh release download -R vladkens/shipo --pattern '*x86_64-unknown-linux-musl.tar.gz' -O - | tar -xz -C "$RUNNER_TEMP/shipo" shipo
          echo "$RUNNER_TEMP/shipo" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: vladkens/actions/rust-publish@v1
        with:
          name: Wavo
          crates: false
          pack: make pack
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SHIPO_UPDATE_KEY: ${{ secrets.SHIPO_UPDATE_KEY }}
