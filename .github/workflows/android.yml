name: android

on:
  workflow_dispatch:
  push:
    paths: ["android/**", "src/cleanup.rs", "src/numbers.rs", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/cleanup.rs", "src/numbers.rs", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/core

      - run: cargo install --locked cargo-ndk

      # The engine is built for the NDK app/build.gradle.kts pins; the runner's own is another
      # version, and nothing installs the pinned one for us. Keep the two in step.
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"

      # The engine's wrapper and the desktop app's text cleanup, on the runner.
      - run: cargo test --release --locked
        working-directory: android/core

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.0

      # No Gradle wrapper in git (its jar is a binary): the Gradle above builds.
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: wavo-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
