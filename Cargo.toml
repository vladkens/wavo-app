[package]
name = "wavo-app"
version = "0.1.0"
edition = "2024"
description = "Local dictation: hold a hotkey, speak, and the text lands where you were typing."
license = "MIT"
repository = "https://github.com/vladkens/wavo-app"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
earshot = "1.2.2"
hound = "3.5.1"
isolang = "2.4.0"
libc = "0.2.191"
nimbo = { git = "https://github.com/vladkens/nimbo", branch = "main" }
rtrb = "0.4.1"
rubato = "5.0.1"
rusqlite = { version = "0.41.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wavo = { git = "https://github.com/vladkens/wavo", branch = "main", default-features = false, features = ["hub"] }
zip = { version = "9.1.1", default-features = false }

# Everything built here, once: no LTO and incremental, a change rebuilds the app's crate and links
# fast. panic = "unwind" (the default), not "abort": the engine thread catches a panic of wavo or
# wgpu and the app carries on. `dist` inherits it.
[profile.release]
strip = true
incremental = true

# The release file of `make dist` (CI): thin LTO.
[profile.dist]
inherits = "release"
lto = "thin"
incremental = false

[build-dependencies]
png = "0.18.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }
