[package]
name = "wavo-app"
version = "0.1.0"
edition = "2024"
description = "Local dictation: hold a hotkey, speak, and the text lands where you were typing."
license = "MIT"
repository = "https://github.com/vladkens/wavo-app"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
earshot = "1.2.2"
hound = "3.5.1"
libc = "0.2.191"
nimbo = { git = "https://github.com/vladkens/nimbo", branch = "main" }
rtrb = "0.4.0"
rubato = "5.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# panic = "unwind" (the default), not "abort": the engine thread catches a panic of wavo or wgpu
# and the app carries on. `fast` inherits it.
[profile.release]
lto = "thin"
strip = true

# `make run` and `make install`: release speed without LTO, rebuilt incrementally, for trying a
# change.
[profile.fast]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
