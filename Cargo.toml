[package]
name = "wavo-app"
version = "0.1.0"
edition = "2024"
description = "Local dictation: hold a hotkey, speak, and the text lands where you were typing."
license = "MIT"
repository = "https://github.com/vladkens/wavo-app"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
earshot = "1.2.2"
hound = "3.5.1"
isolang = "2.4.0"
libc = "0.2.191"
nimbo = { git = "https://github.com/vladkens/nimbo", branch = "main" }
rtrb = "0.4.1"
rubato = "5.0.1"
rusqlite = { version = "0.41.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wavo = { git = "https://github.com/vladkens/wavo", branch = "main", default-features = false, features = ["hub"] }
zip = { version = "9.1.1", default-features = false }

# Everything built here, once: no LTO and incremental, a change rebuilds the app's crate and links
# fast. panic = "unwind" (the default), not "abort": the engine thread catches a panic of wavo or
# wgpu and the app carries on. `dist` inherits it.
# The .deb beside the AppImage (scripts/dist.py): the binary, the launcher entry dist.py writes and
# the icon; GTK and the rest nimbo loads at run time are only recommended.
[package.metadata.deb]
name = "wavo"
maintainer = "vladkens"
section = "utils"
depends = "libc6 (>= 2.35), libasound2 | libasound2t64"
recommends = "libgtk-3-0 | libgtk-3-0t64, libgtk-layer-shell0, libfontconfig1, libfreetype6, libharfbuzz0b, libx11-6, libxtst6"
assets = [
  ["target/release/wavo-app", "usr/bin/", "755"],
  ["target/deb/me.vladkens.wavo.desktop", "usr/share/applications/", "644"],
  ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/me.vladkens.wavo.png", "644"],
]

[profile.release]
strip = true
incremental = true

# The release file of `make dist` (CI): thin LTO.
[profile.dist]
inherits = "release"
lto = "thin"
incremental = false

[build-dependencies]
embed-resource = "3.0.12"
ico = "0.6.0"
png = "0.18.1"
