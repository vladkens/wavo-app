# macOS 14 is the least nimbo runs on (its readme): the binary is built for it, here only, so make
# and cargo build alike; the bundle's Info.plist takes it from the binary (nimbo's scripts/pack.py).
[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

# The C runtime linked in on Windows: Wavo.exe runs without the Visual C++ Redistributable.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
